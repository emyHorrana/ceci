name: CI/CD - Pré-Deploy & Vercel Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instala dependências
        run: npm ci

      - name: 4. DevSecOps - Auditoria de Segurança
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 5. Validação dos Secrets da Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN está vazio ou não cadastrado em Repository Secrets!"; exit 1; fi
          if [ -z "$VERCEL_ORG_ID" ]; then echo "::error::VERCEL_ORG_ID está vazio ou não cadastrado em Repository Secrets!"; exit 1; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "::error::VERCEL_PROJECT_ID está vazio ou não cadastrado em Repository Secrets!"; exit 1; fi
          echo "Todos os Secrets da Vercel foram detectados!"

      - name: 6. Baixa configurações e variáveis da Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: 7. Compila artefatos de deploy com a Vercel CLI
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx vercel build --prod --token=$VERCEL_TOKEN

      - name: 8. Executa Deploy de Produção na Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN